<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理者ページ | 埼玉のめぐみ</title><link rel="stylesheet" href="style.css"></head><body><div class="topline"></div><main class="container"><div class="admin-panel"><p class="kicker">ADMINISTRATION</p><h1 style="font-size:27px;margin:0">管理者ページ</h1><p style="font-size:12px;color:#69736b">ニュース・事業報告の原稿作成</p><div class="notice">重要：このページは現段階では原稿作成用の試作です。安全なログイン認証や、インターネット上のデータベースへの自動保存はまだ接続されていません。公開前にSupabase等の認証・DBを設定してください。パスワードをHTMLに直接書く方式は使用しません。</div><label>投稿種類</label><select id="kind"><option value="news">ニュース</option><option value="reports">事業報告</option></select><label>日付</label><input id="date" type="date"><label>タイトル</label><input id="title" placeholder="記事タイトル"><label>本文</label><textarea id="body" placeholder="記事本文"></textarea><button id="save">JSONデータを作成</button><p id="status" style="font-size:12px"></p><p><a href="index.html" style="color:#315b45;font-size:12px">← 公開サイトに戻る</a></p></div></main><script>document.getElementById('save').onclick=()=>{let kind=document.getElementById('kind').value,date=document.getElementById('date').value,title=document.getElementById('title').value.trim(),body=document.getElementById('body').value.trim();if(!date||!title||!body){document.getElementById('status').textContent='日付・タイトル・本文を入力してください。';return}let blob=new Blob([JSON.stringify({[kind]:[{date,title,body}]},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='content-update.json';a.click();URL.revokeObjectURL(url);document.getElementById('status').textContent='原稿データを作成しました。サイトへの反映は公開環境での更新が必要です。'};</script></body></html>
